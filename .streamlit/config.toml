[theme]
base = "light"
primaryColor = "#0969da"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
font = "sans serif"

[client]
# Hide tracebacks and internal error details from public visitors.
showErrorDetails = "none"
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
