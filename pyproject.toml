[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-live"
description = "Production MLOps platform for NYC Green Taxi trip-duration prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "mlops_live.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ---------------- ruff ----------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
